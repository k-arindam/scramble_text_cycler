name: scramble_text_cycler
description: >-
  A Flutter widget that cycles through a list of strings with a
  hacker-terminal-style scramble animation. Characters flash randomly
  then settle left-to-right, driven by vsync for silky-smooth 60 fps+.
version: 1.0.0
homepage: https://github.com/k-arindam/scramble_text_cycler
repository: https://github.com/k-arindam/scramble_text_cycler
issue_tracker: https://github.com/k-arindam/scramble_text_cycler/issues

topics:
  - animation
  - text
  - widget
  - ui

screenshots:
  - description: 'ScrambleTextCycler demo showing single-line, multi-line, and custom character pool modes.'
    path: media/demo.gif

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
